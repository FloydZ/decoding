name: arm

on: [push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # native arm64 runner (free for public repositories)
        os: [ubuntu-24.04-arm]
        version: [ 14 ]
        build_type: [Release, Debug]

    name: Build & test on ${{ matrix.os }} with gcc-${{ matrix.version }} in ${{ matrix.build_type }} mode.
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Software
      run: |
        sudo apt-get update
        sudo apt-get install -y libtbb-dev g++-${{matrix.version}} libgtest-dev libbenchmark-dev

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DCMAKE_CXX_COMPILER=g++-${{matrix.version}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --parallel $(nproc)

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure --timeout 600 -j$(nproc)
